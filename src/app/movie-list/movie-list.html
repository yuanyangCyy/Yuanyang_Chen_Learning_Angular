<h2>Movie List</h2>

<div *ngFor="let m of movies">
  <!-- UpperCasePipe -->
  <h3>{{ m | movieInfo }}</h3>

  <!-- DatePipe -->
  <p>Release Date: {{ m.releaseDate | date:'longDate' }}</p>

  <!-- CurrencyPipe -->
  <p>Ticket Price: {{ m.price | currency:'USD':'symbol' }}</p>

  <p>Director: {{ m.director | uppercase }}</p>
  <p>Rating: {{ m.rating }}</p>
  <p>Year: {{ m.year }}</p>

  <img [src]="m.image" alt="{{ m.title }}" width="100" />

  <br />
  <button (click)="editMovie(m.id)">Edit</button>
  <button (click)="deleteMovie(m.id)">Delete</button>
  <hr />
</div>
